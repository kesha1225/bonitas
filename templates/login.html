{% extends "base.html" %}

{% block body %}
  <div class="card">
    <h1 class="title">Vdome camera demo</h1>
    <p class="muted">Web login is local. API tokens are loaded from constants in the app.</p>
    {% if info %}
      <p class="pill">{{ info }}</p>
    {% endif %}
    <form method="post" action="/login">
      <label>Login</label>
      <input name="username" autocomplete="username" required />
      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
    </form>
  </div>
{% endblock %}

{% extends "base.html" %}

{% block body %}
  <div class="row header">
    <div>
      <h1 class="title">Cameras</h1>
      <div class="muted">Logged in as {{ phone }}</div>
    </div>
    <form method="post" action="/logout">
      <button type="submit">Log out</button>
    </form>
  </div>
  <div class="grid">
    {% if items %}
      {% for cam in items %}
        <div class="camera">
          <div class="row">
            <strong>{{ cam.name }}</strong>
            <span class="pill">{{ cam.key }}</span>
          </div>
          {% if cam.preview_url %}
            <img src="{{ cam.preview_url }}" alt="preview" loading="lazy" />
          {% else %}
            <div class="preview-empty">No preview</div>
          {% endif %}
          <div class="row" style="margin-top:10px">
            <a class="button" href="/watch/{{ cam.key }}">Open stream</a>
          </div>
        </div>
      {% endfor %}
    {% else %}
      <p class="muted">No cameras found.</p>
    {% endif %}
  </div>
{% endblock %}
